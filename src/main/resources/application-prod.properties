# Perfil "prod": usado na hospedagem (SPRING_PROFILES_ACTIVE=prod).
# Tudo que é segredo ou endereço vem de variáveis de ambiente, nunca do código.

# A hospedagem define a porta pela variável PORT.
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# PostgreSQL. Exemplo de URL: jdbc:postgresql://HOST/NOME_DO_BANCO?sslmode=require
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# O console do H2 não existe em produção.
spring.h2.console.enabled=false

# Em produção o segredo do JWT é obrigatório (sem valor padrão): se faltar, o app não sobe.
republica.jwt.segredo=${JWT_SEGREDO}

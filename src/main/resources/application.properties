spring.application.name=republica
server.port=8080

# Banco H2 em arquivo (pasta ./data). Para MySQL, veja o README.
spring.datasource.url=jdbc:h2:file:./data/republica;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false


spring.h2.console.enabled=true

# Documentação da API: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Login (JWT). Em produção, defina a variável de ambiente JWT_SEGREDO com 32 caracteres ou mais.
republica.jwt.segredo=${JWT_SEGREDO:segredo-apenas-para-desenvolvimento-troque-em-producao}
republica.jwt.validade-horas=12
